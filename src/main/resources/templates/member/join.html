<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .signup-container {
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #43a047;
        }
        .field-error {
            color: #e74a3b;
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .field-error::before {
            content: "⚠️ ";
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h2>회원가입</h2>

    <form th:action="@{/member/join}" method="post" th:object="${member}">

        <!-- 이름 -->
        <label for="name">이름 (필수)</label>
        <input type="text" th:field="*{name}"
        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid':''" id="name">
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <!-- 아이디 -->
        <label for="loginId">아이디 (필수)</label>
        <input type="text" th:field="*{loginId}"
               th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid':''" id="loginId">
        <p class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>

        <!-- 비밀번호 -->
        <label for="password">비밀번호 (필수)</label>
        <input type="password" th:field="*{password}" id="password"
               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid':''">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <!-- 이메일 -->
        <label for="email">이메일 (선택)</label>
        <input type="email" th:field="*{email}" id="email"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid':''">
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <button type="submit">가입하기</button>
    </form>
</div>

</body>
</html>
